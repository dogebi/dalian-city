<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>VOXEL CITY — BUILD · LIVE · GROW</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#8ec9f0;
    font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',-apple-system,'Segoe UI',Roboto,sans-serif}
  #app{position:fixed;inset:0}
  #app canvas{display:block}
  .panel{position:fixed;background:rgba(8,22,44,.78);backdrop-filter:blur(8px);
    color:#eef4fb;border-radius:12px;padding:12px 16px;font-size:13px;
    box-shadow:0 6px 22px rgba(0,10,30,.35);z-index:10}
  #hud-title{top:14px;left:14px;min-width:215px}
  #hud-title .t1{font-size:16px;font-weight:800;letter-spacing:.05em;color:#fff}
  #hud-title .t2{font-size:11px;letter-spacing:.28em;color:#9fc4ef;margin:2px 0 8px}
  #hud-title .row{display:flex;justify-content:space-between;gap:14px;margin-top:3px}
  #hud-title .row b{color:#ffd489;font-weight:700}
  #hud-ctrl{left:14px;bottom:14px;display:flex;align-items:center;gap:8px}

  #hud-info.show{display:block}
  #hud-info .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;
    background:#1a73e8;color:#fff;margin-bottom:8px;letter-spacing:.05em}
  #hud-info .badge.t-res{background:#e8927c}.badge.t-com{background:#3b8ee0}
  .badge.t-sch{background:#e8a13e}.badge.t-hos{background:#e05252}

    font-size:12px;color:#c9dcf2;line-height:1.6}
  #hud-info .close{position:absolute;top:8px;right:10px;cursor:pointer;color:#9fc4ef;font-size:16px}
  #hud-info .close:hover{color:#fff}
  #boot{position:fixed;inset:0;background:linear-gradient(160deg,#0b3d91,#1a73e8 55%,#6cb1f5);
    display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;color:#fff;text-align:center}
  #boot h1{font-size:clamp(30px,6vw,54px);font-weight:800;letter-spacing:.12em;margin:0}
  #boot .sub{letter-spacing:.4em;font-size:13px;color:#bcd9f7;margin:10px 0 26px}
  #boot .bar{width:min(360px,70vw);height:8px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
  #boot .bar i{display:block;height:100%;width:40%;background:#ffd489;border-radius:99px;animation:ld 1.1s ease-in-out infinite}
  @keyframes ld{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
  #boot .msg{margin-top:18px;font-size:13px;color:#d8e9ff;max-width:520px;line-height:1.8;padding:0 16px}
  #boot .msg b{color:#ffd489}
  #boot .err{color:#ffe1e1;font-size:14px;line-height:2;max-width:560px;padding:0 16px}
  #boot .err code{background:rgba(0,0,0,.3);padding:2px 8px;border-radius:6px}
</style>

<script>
/* Three.js 多 CDN 回退加载：file:// 下经典 <script> 不受 CORS 限制 */
(function(){
  var CDNS=[
    "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",
    "https://unpkg.com/three@0.128.0/build/three.min.js",
    "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js",
    "https://cdn.staticfile.org/three.js/r128/three.min.js"
  ];
  var i=0;
  function next(){
    if(i>=CDNS.length){
      document.getElementById("boot").innerHTML=
        '<h1 style="font-size:28px">无法加载 3D 引擎</h1>'+
        '<div class="err">所有 Three.js CDN 均不可达。请检查网络后刷新页面。<br>'+
        '本页面不需要安装任何环境，双击 index.html 用 Chrome / Edge / Firefox 打开即可。<br>'+
        '<code>cdnjs.cloudflare.com · unpkg.com · cdn.jsdelivr.net</code></div>';
      return;
    }
    var s=document.createElement("script");
    s.src=CDNS[i++];
    s.onload=function(){ if(window.__voxelBoot) window.__voxelBoot(); };
    s.onerror=next;
    document.head.appendChild(s);
  }
  window.addEventListener("DOMContentLoaded",next);
})();
</script>
<script>
/* ═══════════ VOXEL CITY — part 2/4 : setup · textures · camera · ground · roads ═══════════ */
window.__voxelBoot = function(){
"use strict";
if(!window.THREE){
  document.getElementById("boot").innerHTML='<div class="err">THREE 未加载</div>';return;
}
var RNG=(function(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};})(20261104);
function rr(a,b){return a+RNG()*(b-a);}
function ri(a,b){return Math.floor(rr(a,b+1));}
function pick(arr){return arr[Math.floor(RNG()*arr.length)];}

/* ── 渲染器 / 场景 ── */
var app=document.getElementById("app");
var renderer;
try{
  renderer=new THREE.WebGLRenderer({antialias:true});
}catch(e){
  document.getElementById("boot").innerHTML='<div class="err">当前浏览器不支持 WebGL，无法运行 3D 城市。</div>';
  return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
app.appendChild(renderer.domElement);

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x8ec9f0);
scene.fog=new THREE.Fog(0xcfe6f7,380,920);

var camera=new THREE.PerspectiveCamera(52,window.innerWidth/window.innerHeight,0.5,1600);

var hemi=new THREE.HemisphereLight(0xcfe6ff,0x7d8f56,0.95);scene.add(hemi);
var amb=new THREE.AmbientLight(0xffffff,0.22);scene.add(amb);
var sun=new THREE.DirectionalLight(0xfff1d6,1.25);
sun.position.set(300,330,140);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-280;sun.shadow.camera.right=460;
sun.shadow.camera.top=430;sun.shadow.camera.bottom=-160;
sun.shadow.camera.near=60;sun.shadow.camera.far=900;
sun.shadow.bias=-0.00045;
scene.add(sun);scene.add(sun.target);
sun.target.position.set(140,0,140);

/* ── 调色板 ── */
var C={
  grass:0x57a94e,grassIn:0x4f9d44,walk:0xc8cbd2,asphalt:0x4b5058,
  lineW:0xf2f4f6,lineY:0xf0d264,sand:0xecd29a,
  water:0x2e9bb5,
  resWalls:[0xf5e7c8,0xe9d8ac,0xd98e5f,0xe8927c,0xf4e2a4,0xbfe0c2,0xf0cfae,0xf6efdd],
  resRoof:[0xc05a45,0xb5503c,0xa8493a,0xc26a4a,0x8f6b4f],
  comWalls:[0xe8eaee,0xdfe3ea,0xcdd6e2,0xd8e0ea],
  carCols:[0xd9483b,0x3b7dd9,0xe9c33b,0x3fa66a,0xf2f4f6,0xc9ccd1,0x8a5bd6,0xe07a3f],
  treeGreens:[0x2f8f3e,0x3da35d,0x4f9d44,0x2e7d4f,0x69b05c]
};

/* ── helper ── */
function lam(c,o){return new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));}
function box(w,h,d,mat,x,y,z,parent,noShadow){
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);
  if(!noShadow)m.castShadow=true;
  m.receiveShadow=true;
  (parent||scene).add(m);return m;
}

/* ── 程序化贴图 ── */
function cvTex(w,h,fn){
  var c=document.createElement("canvas");c.width=w;c.height=h;
  fn(c.getContext("2d"),w,h);
  var t=new THREE.CanvasTexture(c);
  t.magFilter=THREE.NearestFilter;t.minFilter=THREE.LinearMipmapLinearFilter;
  t.encoding=THREE.sRGBEncoding;return t;
}
function facadeTex(base,winA,winB,cols,rows){
  return cvTex(cols*14+8,rows*14+8,function(g,w,h){
    g.fillStyle=base;g.fillRect(0,0,w,h);
    for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
      var lit=RNG()<0.16;
      g.fillStyle=lit?winB:winA;
      g.fillRect(6+c*14,6+r*14,9,9);
    }
  });
}
function glassTex(base,frame){
  return cvTex(128,128,function(g,w,h){
    g.fillStyle=base;g.fillRect(0,0,w,h);
    g.fillStyle="rgba(255,255,255,.18)";g.fillRect(0,0,w,14);
    g.fillStyle=frame;
    for(var x=0;x<=w;x+=16)g.fillRect(x,0,3,h);
    for(var y=16;y<h;y+=24)g.fillRect(0,y,w,3);
  });
}
var TEX={
  winWarm1:facadeTex("#e9d8ac","#5b7ea6","#ffe9b0",5,6),
  winWarm2:facadeTex("#f5e7c8","#62809f","#ffedbe",4,6),
  winCom:facadeTex("#dfe3ea","#274a66","#cfe4f4",6,7),
  glass1:glassTex("#7f9cb5","#56718b"),
  glass2:glassTex("#8fb0c9","#4e6e8a"),
  stripes:cvTex(64,32,function(g,w,h){
    g.fillStyle="#9aa2ab";g.fillRect(0,0,w,h);
    g.fillStyle="rgba(0,0,0,.10)";
    for(var x=2;x<w;x+=8)g.fillRect(x,0,3,h);
  }),
  helipad:cvTex(64,64,function(g,w,h){
    g.fillStyle="#5c6670";g.fillRect(0,0,w,h);
    g.strokeStyle="#f2f4f6";g.lineWidth=5;
    g.beginPath();g.arc(w/2,h/2,24,0,Math.PI*2);g.stroke();
    g.fillStyle="#f2f4f6";g.font="bold 30px sans-serif";
    g.textAlign="center";g.textBaseline="middle";g.fillText("H",w/2,h/2+1);
  })
};

/* ── 相机 + 自制轨道/平移控制 ── */
var cam={theta:Math.PI*0.31,phi:0.98,rad:210,tgt:new THREE.Vector3(140,0,138),
         tTheta:Math.PI*0.31,tPhi:0.98,tRad:210,tTgt:new THREE.Vector3(140,0,138)};
function clampR(r){return Math.min(430,Math.max(34,r));}
function clampPhi(p){return Math.min(1.42,Math.max(0.16,p));}
function clampP(v,a,b){return Math.min(b,Math.max(a,v));}
function applyCam(){
  cam.theta+=(cam.tTheta-cam.theta)*0.14;
  cam.phi+=(cam.tPhi-cam.phi)*0.14;
  cam.rad+=(cam.tRad-cam.rad)*0.14;
  cam.tgt.lerp(cam.tTgt,0.16);
  var y=Math.sin(cam.phi)*cam.rad, r=Math.cos(cam.phi)*cam.rad;
  camera.position.set(cam.tgt.x+r*Math.cos(cam.theta),y,cam.tgt.z+r*Math.sin(cam.theta));
  camera.lookAt(cam.tgt);
}
(function(){
  var el=renderer.domElement,drag=0,px=0,py=0,pinch=0,moved=0,touches={};
  el.addEventListener("contextmenu",function(e){e.preventDefault();});
  el.addEventListener("pointerdown",function(e){
    el.setPointerCapture(e.pointerId);
    if(e.pointerType==="touch"){
      touches[e.pointerId]=[e.clientX,e.clientY];
      px=e.clientX;py=e.clientY;
      var a=Object.values(touches);
      if(a.length===2)pinch=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);
      return;
    }
    drag=(e.button===2||e.shiftKey)?2:1;
    px=e.clientX;py=e.clientY;moved=0;
  });
  el.addEventListener("pointermove",function(e){
    if(e.pointerType==="touch"&&touches[e.pointerId]){
      touches[e.pointerId]=[e.clientX,e.clientY];
      var a=Object.values(touches),cx=0,cy=0;
      for(var q=0;q<a.length;q++){cx+=a[q][0];cy+=a[q][1];}
      cx/=a.length;cy/=a.length;
      if(a.length===1&&px!==undefined){
        cam.tTheta-=(cx-px)*0.006;cam.tPhi=clampPhi(cam.tPhi-(cy-py)*0.005);
      }else if(a.length===2){
        var d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);
        if(pinch)cam.tRad=clampR(cam.tRad*pinch/d);
        pinch=d;
        if(px!==undefined){
          var s1=cam.rad*0.0016,st1=Math.sin(cam.theta),ct1=Math.cos(cam.theta);
          cam.tTgt.x+=(-st1*(cx-px)-ct1*(cy-py))*s1;
          cam.tTgt.z+=(ct1*(cx-px)-st1*(cy-py))*s1;
          cam.tTgt.x=clampP(cam.tTgt.x,-60,560);cam.tTgt.z=clampP(cam.tTgt.z,-60,560);
        }
      }
      px=cx;py=cy;return;
    }
    if(!drag)return;
    var dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;
    moved+=Math.abs(dx)+Math.abs(dy);
    if(drag===1){
      cam.tTheta-=dx*0.0052;cam.tPhi=clampPhi(cam.tPhi-dy*0.0044);
    }else{
      var s=cam.rad*0.0016,st=Math.sin(cam.theta),ct=Math.cos(cam.theta);
      cam.tTgt.x+=(-st*dx-ct*dy)*s;
      cam.tTgt.z+=(ct*dx-st*dy)*s;
      cam.tTgt.x=clampP(cam.tTgt.x,-60,560);cam.tTgt.z=clampP(cam.tTgt.z,-60,560);
    }
  });
  function endp(e){
    if(e.pointerType==="touch"){delete touches[e.pointerId];pinch=0;return;}
    if(drag===1&&moved<6)doPick(e.clientX,e.clientY);
    drag=0;
  }
  el.addEventListener("pointerup",endp);
  el.addEventListener("pointercancel",function(){drag=0;touches={};});
  el.addEventListener("wheel",function(e){
    e.preventDefault();
    cam.tRad=clampR(cam.tRad*(e.deltaY>0?1.1:0.9));
  },{passive:false});
  window.addEventListener("keydown",function(e){
    if(e.key===" "&&!/INPUT|BUTTON/.test((e.target.tagName||""))){e.preventDefault();togglePlay();}
  });
})();

/* ── 地面 ── */
var ground=new THREE.Mesh(new THREE.PlaneGeometry(640,640),lam(C.grass));
ground.rotation.x=-Math.PI/2;ground.position.set(190,-0.06,140);
ground.receiveShadow=true;scene.add(ground);

/* ── 道路网格：G[k]=k*46 (k=0..6) ── */
var G=[0,46,92,138,184,230,276],RW=10,CITY=276;
var matRoad=lam(C.asphalt);
for(var k=0;k<7;k++){
  var p1=new THREE.Mesh(new THREE.PlaneGeometry(CITY+30,RW),matRoad);
  p1.rotation.x=-Math.PI/2;p1.position.set(138,0.02,G[k]);p1.receiveShadow=true;scene.add(p1);
  var p2=new THREE.Mesh(new THREE.PlaneGeometry(RW,CITY+30),matRoad);
  p2.rotation.x=-Math.PI/2;p2.position.set(G[k],0.02,138);p2.receiveShadow=true;scene.add(p2);
}

/* ── 标线合并器（白/黄各 1 Mesh） ── */
function QuadBuilder(){
  this.pos=[];this.idx=[];this.n=0;
}
QuadBuilder.prototype.quad=function(cx,cz,w,h){
  var x0=cx-w/2,x1=cx+w/2,z0=cz-h/2,z1=cz+h/2,p=this.pos,b=this.n;
  p.push(x0,0,z1, x1,0,z1, x1,0,z0, x0,0,z0);
  this.idx.push(b,b+2,b+1, b,b+3,b+2);
  this.n+=4;
};
QuadBuilder.prototype.mesh=function(color,y){
  var g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.Float32BufferAttribute(this.pos,3));
  g.setIndex(this.idx);g.computeVertexNormals();
  var m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:color}));
  m.position.y=y||0.045;scene.add(m);return m;
};
var wq=new QuadBuilder(),yq=new QuadBuilder();
for(var k=0;k<7;k++){
  for(var s=-5;s<CITY+5;s+=6){
    yq.quad(G[k],s+1.5,0.34,3.2);
    yq.quad(s+1.5,G[k],3.2,0.34);
  }
}
function crosswalk(cx,cz,axis){
  for(var i=-2;i<=2;i++){
    if(axis==="x")wq.quad(cx+i*1.7,cz,1.0,7.6);
    else wq.quad(cx,cz+i*1.7,7.6,1.0);
  }
}
for(var ax=0;ax<7;ax++)for(var az=0;az<7;az++){
  var X=G[ax],Z=G[az];
  if(ax>0)wq.quad(X-6.9,Z,1.6,8.4);
  if(ax<6)wq.quad(X+6.9,Z,1.6,8.4);
  if(az>0)wq.quad(X,Z-6.9,8.4,1.6);
  if(az<6)wq.quad(X,Z+6.9,8.4,1.6);
}
function arrow(cx,cz,rot){
  var s=Math.sin(rot),c=Math.cos(rot);
  function q(dx,dz,w,h){var lx=dx*c-dz*s,lz=dx*s+dz*c;wq.quad(cx+lx,cz+lz,w,h);}
  q(0,1.6,0.5,2.4);q(0,3.4,1.6,1.2);q(-0.55,2.9,0.5,0.9);q(0.55,2.9,0.5,0.9);
}
arrow(138,44,0);arrow(138,232,Math.PI);arrow(44,138,Math.PI/2);arrow(232,138,-Math.PI/2);
arrow(230,50,0);arrow(46,226,Math.PI/2);
wq.mesh(C.lineW);yq.mesh(C.lineY);

/* ── 街区块底板 ── */
var matWalk=lam(C.walk);
var matInnerG=lam(C.grassIn);
var matLot=lam(0xd3d6dc);
var BLOCK={};
function plate(i,j,innerMat){
  var x0=46*i+5,z0=46*j+5;
  var p=new THREE.Mesh(new THREE.BoxGeometry(36,0.12,36),matWalk);
  p.position.set(x0+18,0.06,z0+18);p.receiveShadow=true;scene.add(p);

  var dx=B.x-A.x,dz=B.z-A.z;
  var len=Math.hypot(dx,dz);
  var ux=dx/len,uz=dz/len;
  var px=-uz,pz=ux; /* 行进方向右侧 */

  v.g.position.set(A.x+ux*(v.t*len)+px*2.3,onBridge?0.62:0.1,A.z+uz*(v.t*len)+pz*2.3);
  v.tgtYaw=Math.atan2(-uz,ux);
}

function vehUpdate(v,dt){
  var dirx=Math.sign(v.bxn-v.axn),dirz=Math.sign(v.bzn-v.azn);
  var remain=(1-v.t)*v.len;
  var ph=lightPhase();
  var axisLight=(v.axis==="z")?ph.ns:ph.ew;
  var adv=v.spd*dt;
  if(nodeI(v.bxn,v.bzn).sig&&axisLight!=="g"&&remain>6.6){
    adv=Math.min(adv,Math.max(0,remain-6.6));
  }
  v.t+=adv/v.len;
  if(v.t>=1){
    var over=(v.t-1)*v.len;
    /* 选择下一节点：不掉头；优先直行 */
    var cands=[];
    var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(var d=0;d<4;d++){
      var nx2=v.bxn+dirs[d][0],nz2=v.bzn+dirs[d][1];
      if(nx2<0||nx2>6||nz2<0||nz2>6)continue;
      if(nx2===v.axn&&nz2===v.azn)continue;
      var straight=(nx2-v.bxn)===dirx&&(nz2-v.bzn)===dirz;
      cands.push({a:nx2,b:nz2,w:straight?3:1});
    }
    var tot=0;for(var c2=0;c2<cands.length;c2++)tot+=cands[c2].w;
    var rv=RNG()*tot,sel=cands[0];
    for(var c3=0;c3<cands.length;c3++){rv-=cands[c3].w;if(rv<=0){sel=cands[c3];break;}}
    v.axn=v.bxn;v.azn=v.bzn;v.bxn=sel.a;v.bzn=sel.b;
    v.axis=(v.axn===v.bxn)?"z":"x";
    var nl=46;v.t=over/nl;
  }
  placeVehicle(v);
  if(Math.abs(v.tgtYaw-v.curYaw)>0.01){
    var diff=v.tgtYaw-v.curYaw;
    while(diff>Math.PI)diff-=Math.PI*2;
    while(diff<-Math.PI)diff+=Math.PI*2;
    v.curYaw+=diff*Math.min(1,dt*6);
    v.g.rotation.y=v.curYaw;
  }
}

  var bcls={ "住宅":"t-res","商业":"t-com","学校":"t-sch","医院":"t-hos",
             "工业":"t-ind","地标":"t-lan","公园":"t-par" };
  var bd=document.getElementById("ii-badge");
  bd.textContent=info.type;
  bd.className="badge "+(bcls[info.type]||"");
  document.getElementById("ii-name").textContent=info.name;
  document.getElementById("ii-type").textContent=info.type;
  document.getElementById("ii-floors").textContent=info.floors;
  document.getElementById("ii-height").textContent=info.height;
  document.getElementById("ii-zone").textContent=info.zone;
  document.getElementById("ii-desc").textContent=info.desc;
  var panel=document.getElementById("hud-info");
  panel.classList.add("show");
}
document.getElementById("info-close").addEventListener("click",function(){
  document.getElementById("hud-info").classList.remove("show");
});

/* ── HUD 控件 ── */
var playing=true,simSpeed=1,simT=0;
var btnPlay=document.getElementById("btn-play");
function togglePlay(){
  playing=!playing;
  btnPlay.textContent=playing?"⏸ 暂停":"▶ 继续";
}
btnPlay.addEventListener("click",togglePlay);
var spdBtns=document.querySelectorAll(".spd");
for(var sb=0;sb<spdBtns.length;sb++){
  spdBtns[sb].addEventListener("click",function(){
    for(var q=0;q<spdBtns.length;q++)spdBtns[q].classList.remove("on");
    this.classList.add("on");
    simSpeed=parseFloat(this.getAttribute("data-s"));
    if(!playing)togglePlay();
  });
}

/* ── 主循环 ── */
var stB=document.getElementById("st-bld"),stC=document.getElementById("st-car"),
    stP=document.getElementById("st-ped"),stCl=document.getElementById("st-clock");
stB.textContent=String(clickables.length);
stC.textContent=String(vehicles.length);
stP.textContent=String(peds.length);
var last=performance.now()/1000,uiTimer=0;
function animate(){
  requestAnimationFrame(animate);
  var now=performance.now()/1000;
  var dt=Math.min(0.05,Math.max(0.001,now-last));last=now;
  var dts=playing?dt*simSpeed:0;
  simT+=dts;
  for(var v=0;v<vehicles.length;v++){
    var vv=vehicles[v];
    if(vv.idle)continue;
    vehUpdate(vv,dts);
    if(vv.beacon){
      var on=Math.sin(simT*9)>0;
      vv.beacon[0].visible=on;vv.beacon[1].visible=!on;
    }
  }
  for(var vc2=0;vc2<viaCars.length;vc2++){
    var cc=viaCars[vc2];
    cc.g.position.x+=cc.dir*cc.spd*dts;
    if(cc.g.position.x>262)cc.g.position.x=18;
    if(cc.g.position.x<18)cc.g.position.x=262;
  }
  for(var pd=0;pd<peds.length;pd++){
    var p=peds[pd];
    p.off+=p.s*dts*p.dir;
    pedPos(p);
    p.g.position.y=0.16+Math.abs(Math.sin(simT*7+p.ph))*0.05;
  }
  var ph=lightPhase();
  function setLamps(list,st){
    for(var i=0;i<list.length;i++){
      var L=list[i];
      var want=(st==="g")?(L[2].on):(st==="y")?(L[1].on):(L[0].on);
      for(var j=0;j<3;j++)L[j].m.material=(j===(st==="g"?2:st==="y"?1:0))?L[j].on:L[j].off;
    }
  }
  setLamps(lightsNS,ph.ns);setLamps(lightsEW,ph.ew);
  for(var a2=0;a2<anims.length;a2++)anims[a2](simT);
  for(var f2=0;f2<fountains.length;f2++){
    var F=fountains[f2];
    for(var i2=0;i2<F.dat.length;i2++){
      var d2=F.dat[i2],life=((simT*d2.sp)+d2.ph)%1;
      F.pos[i2*3]=Math.cos(d2.a)*d2.r*life*1.5;
      F.pos[i2*3+1]=0.95+Math.sin(life*Math.PI)*3.1;
      F.pos[i2*3+2]=Math.sin(d2.a)*d2.r*life*1.5;
    }
    F.pg.attributes.position.needsUpdate=true;
  }
  for(var c3=0;c3<clouds.length;c3++){
    var clo=clouds[c3];
    clo.g.position.x+=clo.v*dts;
    if(clo.g.position.x>540)clo.g.position.x=-80;
  }
  uiTimer+=dt;
  if(uiTimer>0.5){
    uiTimer=0;
    var tot=(480+Math.floor(simT*2))%1440;
    stCl.textContent=("0"+Math.floor(tot/60)).slice(-2)+":"+("0"+tot%60).slice(-2);
  }
  applyCam();
  renderer.render(scene,camera);
}
window.addEventListener("resize",function(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
document.getElementById("boot").style.display="none";
animate();};
</script>
